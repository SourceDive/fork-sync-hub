name: Sync All Forks

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      fork_filter:
        description: 可选，按 fork 名称过滤（如 spring-ai）
        required: false
        default: ''
      sync_tags:
        description: 是否同步 tags
        type: boolean
        default: true
      tag_force:
        description: 推送 tags 时是否强制覆盖 fork 上同名 tag
        type: boolean
        default: true
      sync_branches:
        description: 是否同步分支
        type: boolean
        default: true
      branch_sync_mode:
        description: 分支同步方式（merge 保留 fork 提交 / rebase / force 用上游覆盖）
        type: choice
        options:
          - force
          - merge
          - rebase
        default: merge

concurrency:
  group: sync-all-forks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      sync_tags: ${{ steps.set-flags.outputs.sync_tags }}
      tag_force: ${{ steps.set-flags.outputs.tag_force }}
      sync_branches: ${{ steps.set-flags.outputs.sync_branches }}
      branch_sync_mode: ${{ steps.set-flags.outputs.branch_sync_mode }}
    steps:
      - uses: actions/checkout@v4

      - id: set-flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sync_tags=${{ inputs.sync_tags }}" >> "$GITHUB_OUTPUT"
            echo "tag_force=${{ inputs.tag_force }}" >> "$GITHUB_OUTPUT"
            echo "sync_branches=${{ inputs.sync_branches }}" >> "$GITHUB_OUTPUT"
            echo "branch_sync_mode=${{ inputs.branch_sync_mode }}" >> "$GITHUB_OUTPUT"
          else
            # 定时任务：作为镜像，默认强制同步 tags 与分支
            echo "sync_tags=true" >> "$GITHUB_OUTPUT"
            echo "tag_force=true" >> "$GITHUB_OUTPUT"
            echo "sync_branches=true" >> "$GITHUB_OUTPUT"
            echo "branch_sync_mode=force" >> "$GITHUB_OUTPUT"
          fi

      - id: set-matrix
        run: |
          FILTER="${{ github.event.inputs.fork_filter }}"
          if [ -n "$FILTER" ]; then
            MATRIX=$(jq -c --arg f "$FILTER" '[.[] | select(.fork | test($f))]' forks.json)
          else
            MATRIX=$(jq -c '.' forks.json)
          fi
          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "将同步 ${COUNT} 个 fork 仓库"
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout hub action
        uses: actions/checkout@v4

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.fork }}
          token: ${{ secrets.SYNC_FORK_TOKEN }}
          fetch-depth: 0
          path: repo

      - uses: ./
        with:
          upstream_repo: ${{ matrix.upstream }}
          github_token: ${{ secrets.SYNC_FORK_TOKEN }}
          sync_tags: ${{ needs.prepare.outputs.sync_tags }}
          tag_force: ${{ needs.prepare.outputs.tag_force }}
          sync_branches: ${{ needs.prepare.outputs.sync_branches }}
          target_branch: ${{ matrix.target_branch }}
          branch_sync_mode: ${{ needs.prepare.outputs.branch_sync_mode }}
          working_directory: repo
